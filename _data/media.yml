items:
  - outlet: "Dialogue Earth (LinkedIn)"
    date: 2026-11-23
    title: "Heat is shaping children's futures"
    author: "Yasna Palmeiro-Silva & Tolullah Oni (UrbanBetter)"
    url: "https://www.linkedin.com/posts/dialogueearth_heat-is-shaping-childrens-futures-activity-7530576404464386048-NuRP"
    lang: "en"
    kind:
      es: "Entrevista en video"
      en: "Video interview"
      pt: "Entrevista em vídeo"
    summary:
      es: "En el Global Heat Forum 2026, en Bangkok, Dialogue Earth conversó con Yasna Palmeiro-Silva y Tolullah Oni sobre por qué el calor extremo no afecta a todos por igual, lo poco que aún se sabe de sus efectos a largo plazo en niñas, niños y adolescentes, y el papel de las y los jóvenes en las soluciones."
      en: "At the Global Heat Forum 2026 in Bangkok, Dialogue Earth spoke with Yasna Palmeiro-Silva and Tolullah Oni about why extreme heat does not affect everyone equally, how little is still known about its long-term effects on children and young people, and the role of young people in the solutions."
      pt: "No Global Heat Forum 2026, em Bangkok, a Dialogue Earth conversou com Yasna Palmeiro-Silva e Tolullah Oni sobre por que o calor extremo não afeta todos da mesma forma, o pouco que ainda se sabe sobre seus efeitos de longo prazo em crianças e adolescentes e o papel dos jovens nas soluções."

  - outlet: "TV Valdivia"
    date: 2026-10-26
    title: "Entrevista a Tamara Hoffmann: investigación escuelas y cambio climático"
    author: "Tamara Hoffmann Ferrada"
    url: "https://www.youtube.com/watch?v=lYX8RnfPluI"
    lang: "es"
    kind:
      es: "Entrevista en radio"
      en: "Radio interview"
      pt: "Entrevista na rádio"
    summary:
      es: "Tamara Hoffmann, a cargo del componente cualitativo de EscuelasCool, explica cómo El Niño 2026–27 y el cambio climático afectan la salud, el bienestar y el aprendizaje de niñas y niños, cómo se estudiará el calor en las salas de clases de Chile, Colombia y Perú, y por qué la meta son escuelas más resilientes."
      en: "Tamara Hoffmann, who leads EscuelasCool's qualitative component, explains how El Niño 2026–27 and climate change affect children's health, wellbeing and learning, how heat in classrooms will be studied in Chile, Colombia and Peru, and why the goal is more resilient schools."
      pt: "Tamara Hoffmann, responsável pelo componente qualitativo do EscuelasCool, explica como o El Niño 2026–27 e a mudança climática afetam a saúde, o bem-estar e a aprendizagem das crianças, como o calor nas salas de aula será estudado no Chile, na Colômbia e no Peru, e por que a meta são escolas mais resilientes."

  - outlet: "EL PAÍS Chile"
    date: 2026-11-18
    title: "El cambio climático también profundiza la desigualdad educativa"
    author: "Martín Andrade Ruiz-Tagle (Corporación Ciudades)"
    url: "https://elpais.com/chile/2026-11-18/el-cambio-climatico-tambien-profundiza-la-desigualdad-educativa.html"
    lang: "es"
    kind:
      es: "Tribuna"
      en: "Op-ed"
      pt: "Artigo de opinião"
    summary:
      es: "Columna sobre cómo el calor extremo y otros impactos climáticos profundizan las brechas educativas en América Latina, y por qué adaptar las escuelas al clima que viene. Presenta EscuelasCool como la iniciativa que genera evidencia para orientar mejores decisiones educativas y urbanas."
      en: "An op-ed on how extreme heat and other climate impacts are widening educational gaps in Latin America, and why schools must be adapted to the climate ahead. It presents EscuelasCool as the initiative generating evidence to inform better education and urban policy decisions."
      pt: "Artigo sobre como o calor extremo e outros impactos climáticos aprofundam as desigualdades educacionais na América Latina, e por que é preciso adaptar as escolas ao clima que vem. Apresenta o EscuelasCool como a iniciativa que gera evidências para orientar melhores decisões educacionais e urbanas."
